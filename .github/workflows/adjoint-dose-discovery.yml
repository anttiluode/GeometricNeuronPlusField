name: adjoint-dose-discovery

on:
  push:
    paths:
      - 'adjoint_dose_probe.py'
      - 'ADJOINT_DOSE_DISCOVERY_PREREG_V01.md'
      - '.github/workflows/adjoint-dose-discovery.yml'
  workflow_dispatch:

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout FunctionalArbors
        uses: actions/checkout@v4
        with:
          repository: anttiluode/FunctionalArbors
          path: FunctionalArbors
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python adjoint_dose_probe.py --selftest
      - name: Fresh discovery seeds 192-203
        run: python adjoint_dose_probe.py --functional-arbors FunctionalArbors --seed-start 192 --seeds 12 --max-each 6 --out runs/adjoint_dose_discovery/adjoint_dose_192_203.json
      - uses: actions/upload-artifact@v4
        with:
          name: adjoint-dose-discovery-192-203
          path: runs/adjoint_dose_discovery/
