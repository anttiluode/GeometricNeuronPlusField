name: ais-final-phase

on:
  workflow_dispatch:
  push:
    paths:
      - 'ais_interface_phase_probe.py'
      - 'AIS_FINAL_PHASE_PREREG_V01.md'
      - '.github/workflows/ais-final-phase.yml'

jobs:
  phase:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Checkout FunctionalArbors
        uses: actions/checkout@v4
        with:
          repository: anttiluode/FunctionalArbors
          path: FunctionalArbors

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install -r requirements.txt

      - name: Selftest
        run: python ais_interface_phase_probe.py --selftest

      - name: Final phase/interface canonical run
        run: >-
          python ais_interface_phase_probe.py
          --functional-arbors FunctionalArbors
          --seed-start 0
          --seeds 24
          --freq-steps 640
          --burn 160
          --min-events 4
          --upper-min-freq 0.05
          --min-valid-bodies 8
          --out runs/ais_final_phase/ais_final_phase.json

      - name: Upload receipt
        uses: actions/upload-artifact@v4
        with:
          name: ais-final-phase-24
          path: runs/ais_final_phase/
