name: ais-gate-ablation

on:
  workflow_dispatch:
  push:
    paths:
      - 'ais_active_probe.py'
      - 'ais_gate_ablation_probe.py'
      - 'AIS_GATE_ABLATION_PREREG_V01.md'
      - '.github/workflows/ais-gate-ablation.yml'

jobs:
  ablation:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Checkout FunctionalArbors
        uses: actions/checkout@v4
        with:
          repository: anttiluode/FunctionalArbors
          path: FunctionalArbors
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Run gating-memory ablation
        run: >-
          python ais_gate_ablation_probe.py
          --functional-arbors FunctionalArbors
          --seed-start 0
          --seeds 24
          --lag 20
          --task-steps 180
          --freq-steps 640
          --burn 160
          --out runs/ais_gate_ablation/ais_gate_ablation.json
      - name: Upload receipt
        uses: actions/upload-artifact@v4
        with:
          name: ais-gate-ablation-24
          path: runs/ais_gate_ablation/
