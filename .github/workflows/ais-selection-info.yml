name: ais-selection-info

on:
  workflow_dispatch:
  push:
    paths:
      - 'ais_selection_info_probe.py'
      - 'AIS_SELECTION_INFO_PREREG_V01.md'
      - '.github/workflows/ais-selection-info.yml'

jobs:
  selection:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Checkout FunctionalArbors
        uses: actions/checkout@v4
        with:
          repository: anttiluode/FunctionalArbors
          path: FunctionalArbors

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install -r requirements.txt

      - name: Selftest
        run: python ais_selection_info_probe.py --selftest

      - name: Selection-information canonical run
        run: >-
          python ais_selection_info_probe.py
          --functional-arbors FunctionalArbors
          --seed-start 0
          --seeds 24
          --freq-steps 640
          --burn 160
          --min-total-events 12
          --min-valid-bodies 12
          --out runs/ais_selection_info/ais_selection_info.json

      - name: Upload receipt
        uses: actions/upload-artifact@v4
        with:
          name: ais-selection-info-24
          path: runs/ais_selection_info/
