name: analog-frontier-learning

on:
  push:
    paths:
      - 'analog_frontier_learning.py'
      - 'ANALOG_FRONTIER_LEARNING_PREREG_V01.md'
      - '.github/workflows/analog-frontier-learning.yml'
  workflow_dispatch:

jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout FunctionalArbors
        uses: actions/checkout@v4
        with:
          repository: anttiluode/FunctionalArbors
          path: FunctionalArbors
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python analog_frontier_learning.py --selftest
      - name: Fresh discovery seeds 240-251
        run: python analog_frontier_learning.py --functional-arbors FunctionalArbors --seed-start 240 --seeds 12 --max-candidates 8 --eta 0.01 --iterations 40 --out runs/analog_frontier_learning/analog_frontier_learning_240_251.json
      - uses: actions/upload-artifact@v4
        with:
          name: analog-frontier-learning-240-251
          path: runs/analog_frontier_learning/
