name: biological-return-confirm

on:
  push:
    paths:
      - 'BIOLOGICAL_RETURN_CONFIRM_PREREG_V01.md'
      - 'biological_return_code_probe.py'
      - 'biological_return_confirm.py'
      - '.github/workflows/biological-return-confirm.yml'
  workflow_dispatch:

jobs:
  confirm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout FunctionalArbors
        uses: actions/checkout@v4
        with:
          repository: anttiluode/FunctionalArbors
          path: FunctionalArbors
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python biological_return_code_probe.py --selftest
      - name: Fresh bodies 498-509
        run: python biological_return_code_probe.py --functional-arbors FunctionalArbors --seed-start 498 --seeds 12 --lag 20 --steps 210 --out runs/biological_return_confirm/return_498_509.json
      - name: Evaluate preregistration
        run: python biological_return_confirm.py --receipt runs/biological_return_confirm/return_498_509.json --out runs/biological_return_confirm/verdict.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: biological-return-confirm-498-509
          path: runs/biological_return_confirm/
