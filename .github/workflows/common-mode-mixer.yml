name: common-mode-mixer

on:
  workflow_dispatch:
  push:
    paths:
      - 'common_mode_mixer_probe.py'
      - '.github/workflows/common-mode-mixer.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Checkout FunctionalArbors
        uses: actions/checkout@v4
        with:
          repository: anttiluode/FunctionalArbors
          path: FunctionalArbors
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python common_mode_mixer_probe.py --selftest
      - name: Exploratory reused bodies 72-95
        run: >-
          python common_mode_mixer_probe.py
          --functional-arbors FunctionalArbors
          --seed-start 72
          --seeds 24
          --lag 20
          --steps 210
          --out runs/common_mode_mixer/common_mode_mixer.json
      - uses: actions/upload-artifact@v4
        with:
          name: common-mode-mixer-72-95
          path: runs/common_mode_mixer/
