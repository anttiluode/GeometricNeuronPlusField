name: coordinate-curvature-confirm

on:
  push:
    paths:
      - 'COORDINATE_CURVATURE_CONFIRM_PREREG_V01.md'
      - 'coordinate_curvature_probe.py'
      - '.github/workflows/coordinate-curvature-confirm.yml'
  workflow_dispatch:

jobs:
  curvature:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout FunctionalArbors
        uses: actions/checkout@v4
        with:
          repository: anttiluode/FunctionalArbors
          path: FunctionalArbors
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python coordinate_curvature_probe.py --selftest
      - name: Fresh curvature seeds 324-335
        run: python coordinate_curvature_probe.py --functional-arbors FunctionalArbors --seed-start 324 --seeds 12 --P 8 --train-lags 16,20,24 --eval-lags 14,16,18,20,22,24,26 --out runs/coordinate_curvature_confirm/curvature_324_335.json
      - uses: actions/upload-artifact@v4
        with:
          name: coordinate-curvature-confirm-324-335
          path: runs/coordinate_curvature_confirm/
