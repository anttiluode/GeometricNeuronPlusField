name: coordinate-curvature-dev

on:
  push:
    paths:
      - 'coordinate_curvature_probe.py'
      - '.github/workflows/coordinate-curvature-dev.yml'
  workflow_dispatch:

jobs:
  curvature:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout FunctionalArbors
        uses: actions/checkout@v4
        with:
          repository: anttiluode/FunctionalArbors
          path: FunctionalArbors
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python coordinate_curvature_probe.py --selftest
      - name: Reused development seeds 240-243
        run: python coordinate_curvature_probe.py --functional-arbors FunctionalArbors --seed-start 240 --seeds 4 --P 8 --train-lags 16,20,24 --eval-lags 14,16,18,20,22,24,26 --out runs/coordinate_curvature_dev/curvature_240_243.json
      - uses: actions/upload-artifact@v4
        with:
          name: coordinate-curvature-dev-240-243
          path: runs/coordinate_curvature_dev/
