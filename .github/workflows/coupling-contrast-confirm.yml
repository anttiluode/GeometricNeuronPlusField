name: coupling-contrast-confirm

on:
  push:
    paths:
      - 'COUPLING_CONTRAST_CONFIRM_PREREG_V01.md'
      - 'coupling_contrast_sweep.py'
      - '.github/workflows/coupling-contrast-confirm.yml'
  workflow_dispatch:

jobs:
  confirm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout FunctionalArbors
        uses: actions/checkout@v4
        with:
          repository: anttiluode/FunctionalArbors
          path: FunctionalArbors
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python coupling_contrast_sweep.py --selftest
      - name: Fresh seeds 300-311
        run: python coupling_contrast_sweep.py --functional-arbors FunctionalArbors --seed-start 300 --seeds 12 --lags 14,18,20,22,26 --out runs/coupling_contrast_confirm/sweep_300_311.json
      - uses: actions/upload-artifact@v4
        with:
          name: coupling-contrast-confirm-300-311
          path: runs/coupling_contrast_confirm/
