name: damping-gauge-combined-closed-loop-dev
on:
  push:
    paths:
      - 'damping_gauge_combined_closed_loop.py'
      - '.github/workflows/damping-gauge-combined-closed-loop-dev.yml'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: anttiluode/FunctionalArbors
          path: FunctionalArbors
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Closed-loop learning with combined hardware errors on reused bodies
        run: >-
          python damping_gauge_combined_closed_loop.py
          --functional-arbors FunctionalArbors
          --seed-start 472 --seeds 8
          --lag 20 --steps 210
          --max-candidates 8 --eta .01 --iterations 24
          --mean-eps .005 --loss-cv .20 --loss-cal-error .05
          --mirror-alpha .95 --operator-drift .02 --readout-noise .05
          --out runs/damping_gauge_combined_closed_loop/dev_472_479.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: damping-gauge-combined-closed-loop-dev-472-479
          path: runs/damping_gauge_combined_closed_loop/
