name: damping-gauge-pass-drift-dev
on:
  push:
    paths:
      - 'damping_gauge_pass_drift_probe.py'
      - '.github/workflows/damping-gauge-pass-drift-dev.yml'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: anttiluode/FunctionalArbors
          path: FunctionalArbors
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Differential +/- pass drift on reused bodies
        run: >-
          python damping_gauge_pass_drift_probe.py
          --functional-arbors FunctionalArbors
          --seed-start 472 --seeds 4
          --lag 20 --steps 210
          --mean-eps .005 --loss-cv .20 --loss-cal-error .05
          --mirror-alpha .95 --common-drift .02
          --reps 4
          --out runs/damping_gauge_pass_drift/dev_472_475.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: damping-gauge-pass-drift-dev-472-475
          path: runs/damping_gauge_pass_drift/
