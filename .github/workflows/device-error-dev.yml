name: device-error-dev

on:
  push:
    paths:
      - 'device_error_probe.py'
      - '.github/workflows/device-error-dev.yml'
  workflow_dispatch:

jobs:
  error:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout FunctionalArbors
        uses: actions/checkout@v4
        with:
          repository: anttiluode/FunctionalArbors
          path: FunctionalArbors
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python device_error_probe.py --selftest
      - name: Reused development seeds 400-403
        run: python device_error_probe.py --functional-arbors FunctionalArbors --seed-start 400 --seeds 4 --lag 20 --steps 210 --reps 8 --out runs/device_error/dev_400_403.json
      - uses: actions/upload-artifact@v4
        with:
          name: device-error-dev-400-403
          path: runs/device_error/
