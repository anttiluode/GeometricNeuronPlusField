name: graph-mode-probe

on:
  workflow_dispatch:
  push:
    paths:
      - 'graph_mode_probe.py'
      - 'confirm_graph_band.py'
      - 'modal_mechanism_probe.py'
      - 'modal_locality.py'
      - 'local_observability_probe.py'
      - 'task_bottleneck_probe.py'
      - 'ais_active_probe.py'
      - 'AIS_ACTIVE_PREREG_V01.md'
      - '.github/workflows/graph-mode-probe.yml'

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout GeometricNeuronPlusField
        uses: actions/checkout@v4

      - name: Checkout FunctionalArbors
        uses: actions/checkout@v4
        with:
          repository: anttiluode/FunctionalArbors
          path: FunctionalArbors

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install -r requirements.txt

      - name: Selftest
        run: python graph_mode_probe.py --selftest

      - name: Active AIS boundary selftest
        run: python ais_active_probe.py --selftest

      - name: Canonical discovery set, seeds 0-11
        run: >-
          python graph_mode_probe.py
          --functional-arbors FunctionalArbors
          --seeds 12
          --modes 24
          --outdir runs/graph_modes

      - name: Held-out confirmation, seeds 12-23
        run: >-
          python confirm_graph_band.py
          --functional-arbors FunctionalArbors
          --seed-start 12
          --seeds 12
          --modes 24
          --lag 20
          --outdir runs/confirm_graph_band

      - name: Modal mechanism probe, seeds 0-11
        run: >-
          python modal_mechanism_probe.py
          --functional-arbors FunctionalArbors
          --seed-start 0
          --seeds 12
          --lag 20
          --outdir runs/modal_mechanism

      - name: Modal locality audit, seeds 0-11
        run: >-
          python modal_locality.py
          --functional-arbors FunctionalArbors
          --seed-start 0
          --seeds 12
          --perts 25
          --out runs/modal_locality/modal_locality.json

      - name: Local task-band observability, seeds 0-23
        run: >-
          python local_observability_probe.py
          --functional-arbors FunctionalArbors
          --seed-start 0
          --seeds 24
          --random-controls 250
          --out runs/local_observability/local_observability.json

      - name: Soma task-bottleneck probe, seeds 0-23
        run: >-
          python task_bottleneck_probe.py
          --functional-arbors FunctionalArbors
          --seed-start 0
          --seeds 24
          --lag 20
          --steps 150
          --random-controls 250
          --out runs/task_bottleneck/task_bottleneck.json

      - name: Active AIS boundary, seeds 0-23
        run: >-
          python ais_active_probe.py
          --functional-arbors FunctionalArbors
          --seed-start 0
          --seeds 24
          --lag 20
          --task-steps 180
          --freq-steps 640
          --burn 160
          --out runs/ais_active/ais_active.json

      - name: Upload discovery receipts
        uses: actions/upload-artifact@v4
        with:
          name: graph-mode-probe-12
          path: runs/graph_modes/

      - name: Upload held-out confirmation
        uses: actions/upload-artifact@v4
        with:
          name: heldout-graph-band-12-23
          path: runs/confirm_graph_band/

      - name: Upload modal mechanism
        uses: actions/upload-artifact@v4
        with:
          name: modal-mechanism-12
          path: runs/modal_mechanism/

      - name: Upload modal locality
        uses: actions/upload-artifact@v4
        with:
          name: modal-locality-12
          path: runs/modal_locality/

      - name: Upload local observability
        uses: actions/upload-artifact@v4
        with:
          name: local-observability-24
          path: runs/local_observability/

      - name: Upload task bottleneck
        uses: actions/upload-artifact@v4
        with:
          name: task-bottleneck-24
          path: runs/task_bottleneck/

      - name: Upload active AIS boundary
        uses: actions/upload-artifact@v4
        with:
          name: ais-active-boundary-24
          path: runs/ais_active/
