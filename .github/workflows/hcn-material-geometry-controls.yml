name: hcn-material-geometry-controls

on:
  push:
    paths:
      - 'hcn_material_geometry_controls.py'
      - '.github/workflows/hcn-material-geometry-controls.yml'
  workflow_dispatch:

jobs:
  controls:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: anttiluode/FunctionalArbors
          path: FunctionalArbors
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Distance-preserving controls on development bodies 580-583
        run: >-
          python hcn_material_geometry_controls.py
          --functional-arbors FunctionalArbors
          --seed-start 580 --seeds 4
          --omegas 0.03,0.04
          --tau 2 --mu 0.5
          --g0 0.005 --ratio 10
          --steps 50 --step-fraction 0.10
          --nshuffle 24
          --out runs/hcn_material_geometry/dev_580_583.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hcn-material-geometry-controls-580-583
          path: runs/hcn_material_geometry/
