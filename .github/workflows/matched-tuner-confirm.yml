name: matched-tuner-confirm

on:
  push:
    paths:
      - 'MATCHED_TUNER_CONFIRM_PREREG_V01.md'
      - 'matched_tuner_audit.py'
      - '.github/workflows/matched-tuner-confirm.yml'
  workflow_dispatch:

jobs:
  confirm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout FunctionalArbors
        uses: actions/checkout@v4
        with:
          repository: anttiluode/FunctionalArbors
          path: FunctionalArbors
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python matched_tuner_audit.py --selftest
      - name: Fresh held-out seeds 288-299
        run: python matched_tuner_audit.py --functional-arbors FunctionalArbors --seed-start 288 --seeds 12 --P 8 --eta 0.01 --iterations 40 --train-lags 16,20,24 --test-lags 14,18,22,26 --out runs/matched_tuner_confirm/matched_tuner_288_299.json
      - uses: actions/upload-artifact@v4
        with:
          name: matched-tuner-confirm-288-299
          path: runs/matched_tuner_confirm/
