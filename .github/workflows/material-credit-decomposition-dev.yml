name: material-credit-decomposition-dev
on:
  push:
    paths:
      - 'material_credit_decomposition.py'
      - '.github/workflows/material-credit-decomposition-dev.yml'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: anttiluode/FunctionalArbors
          path: FunctionalArbors
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Decompose exact material credit on development bodies 622-627
        run: >-
          python material_credit_decomposition.py
          --functional-arbors FunctionalArbors
          --seed-start 622 --seeds 6
          --omegas 0.03,0.04 --tau 2 --mu 0.5
          --g0 0.005 --ratio 10
          --steps 50 --step-fraction 0.10 --nshuffle 12
          --out runs/material_credit_decomposition/dev_622_627.json
      - uses: actions/upload-artifact@v4
        with:
          name: material-credit-decomposition-dev-622-627
          path: runs/material_credit_decomposition/
