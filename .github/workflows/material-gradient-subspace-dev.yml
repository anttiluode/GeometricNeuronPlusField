name: material-gradient-subspace-dev
on:
  push:
    paths:
      - 'material_gradient_subspace.py'
      - '.github/workflows/material-gradient-subspace-dev.yml'
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: anttiluode/FunctionalArbors
          path: FunctionalArbors
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Decompose radial and within-shell material credit on development bodies
        run: >-
          python material_gradient_subspace.py
          --functional-arbors FunctionalArbors
          --seed-start 622 --seeds 6
          --omegas 0.03,0.04 --tau 2 --mu 0.5
          --g0 0.005 --ratio 10
          --full-steps 50 --radial-steps 160 --step-fraction 0.10
          --out runs/material_gradient_subspace/dev_622_627.json
      - uses: actions/upload-artifact@v4
        with:
          name: material-gradient-subspace-dev-622-627
          path: runs/material_gradient_subspace/
