name: mode-pair-confirm

on:
  workflow_dispatch:
  push:
    paths:
      - 'mode_pair_confirm_probe.py'
      - 'MODE_PAIR_CONFIRM_PREREG_V01.md'
      - '.github/workflows/mode-pair-confirm.yml'

jobs:
  confirm:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout GeometricNeuronPlusField
        uses: actions/checkout@v4

      - name: Checkout FunctionalArbors
        uses: actions/checkout@v4
        with:
          repository: anttiluode/FunctionalArbors
          path: FunctionalArbors

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install -r requirements.txt

      - name: Selftest
        run: python mode_pair_confirm_probe.py --selftest

      - name: Held-out seeds 84-95
        run: >-
          python mode_pair_confirm_probe.py
          --functional-arbors FunctionalArbors
          --seed-start 84
          --seeds 12
          --lag 20
          --steps 210
          --out runs/mode_pair_confirm/mode_pair_confirm.json

      - name: Upload receipt
        uses: actions/upload-artifact@v4
        with:
          name: mode-pair-confirm-84-95
          path: runs/mode_pair_confirm/
