name: mode-pair-discovery

on:
  workflow_dispatch:
  push:
    paths:
      - 'mode_pair_discovery_probe.py'
      - 'MODE_PAIR_DISCOVERY_PREREG_V01.md'
      - '.github/workflows/mode-pair-discovery.yml'

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout GeometricNeuronPlusField
        uses: actions/checkout@v4

      - name: Checkout FunctionalArbors
        uses: actions/checkout@v4
        with:
          repository: anttiluode/FunctionalArbors
          path: FunctionalArbors

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: pip install -r requirements.txt

      - name: Selftest
        run: python mode_pair_discovery_probe.py --selftest

      - name: Fresh discovery seeds 72-83
        run: >-
          python mode_pair_discovery_probe.py
          --functional-arbors FunctionalArbors
          --seed-start 72
          --seeds 12
          --lag 20
          --steps 210
          --out runs/mode_pair_discovery/mode_pair_discovery.json

      - name: Upload receipt
        uses: actions/upload-artifact@v4
        with:
          name: mode-pair-discovery-72-83
          path: runs/mode_pair_discovery/
