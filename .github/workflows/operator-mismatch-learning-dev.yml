name: operator-mismatch-learning-dev

on:
  push:
    paths:
      - 'operator_mismatch_learning_probe.py'
      - '.github/workflows/operator-mismatch-learning-dev.yml'
  workflow_dispatch:

jobs:
  learn:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout FunctionalArbors
        uses: actions/checkout@v4
        with:
          repository: anttiluode/FunctionalArbors
          path: FunctionalArbors
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python operator_mismatch_learning_probe.py --selftest
      - name: Reused development seeds 412-415
        run: python operator_mismatch_learning_probe.py --functional-arbors FunctionalArbors --seed-start 412 --seeds 4 --lag 20 --steps 210 --max-candidates 8 --eta .01 --iterations 40 --out runs/operator_mismatch_learning/dev_412_415.json
      - uses: actions/upload-artifact@v4
        with:
          name: operator-mismatch-learning-dev-412-415
          path: runs/operator_mismatch_learning/
