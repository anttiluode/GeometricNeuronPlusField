name: pass-budget-dev

on:
  push:
    paths:
      - 'pass_budget_probe.py'
      - '.github/workflows/pass-budget-dev.yml'
  workflow_dispatch:

jobs:
  passes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout FunctionalArbors
        uses: actions/checkout@v4
        with:
          repository: anttiluode/FunctionalArbors
          path: FunctionalArbors
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python pass_budget_probe.py --selftest
      - name: Reused development seeds 240-243
        run: python pass_budget_probe.py --functional-arbors FunctionalArbors --seed-start 240 --seeds 4 --P 8 --train-lags 16,20,24 --test-lags 14,18,22,26 --out runs/pass_budget_dev/pass_budget_240_243.json
      - uses: actions/upload-artifact@v4
        with:
          name: pass-budget-dev-240-243
          path: runs/pass_budget_dev/
