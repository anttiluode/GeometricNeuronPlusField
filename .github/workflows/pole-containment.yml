name: pole-containment

on:
  push:
    paths:
      - 'full_pole_containment.py'
      - '.github/workflows/pole-containment.yml'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout FunctionalArbors
        uses: actions/checkout@v4
        with:
          repository: anttiluode/FunctionalArbors
          path: FunctionalArbors
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python full_pole_containment.py --selftest
      - name: Exact full-operator containment on reused seed 264
        run: python full_pole_containment.py --functional-arbors FunctionalArbors --seed-start 264 --seeds 1 --out runs/pole_containment/pole_containment_264.json
      - uses: actions/upload-artifact@v4
        with:
          name: pole-containment-264
          path: runs/pole_containment/
