name: random-frontier-control

on:
  push:
    paths:
      - 'RANDOM_FRONTIER_CONTROL_PREREG_V01.md'
      - 'random_frontier_control.py'
      - '.github/workflows/random-frontier-control.yml'
  workflow_dispatch:

jobs:
  control:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout FunctionalArbors
        uses: actions/checkout@v4
        with:
          repository: anttiluode/FunctionalArbors
          path: FunctionalArbors
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python random_frontier_control.py --selftest
      - name: Fresh random-control seeds 276-287
        run: python random_frontier_control.py --functional-arbors FunctionalArbors --seed-start 276 --seeds 12 --max-each 6 --out runs/random_frontier_control/random_frontier_276_287.json
      - uses: actions/upload-artifact@v4
        with:
          name: random-frontier-control-276-287
          path: runs/random_frontier_control/
