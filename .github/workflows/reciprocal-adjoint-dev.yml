name: reciprocal-adjoint-dev

on:
  push:
    paths:
      - 'reciprocal_adjoint_probe.py'
      - '.github/workflows/reciprocal-adjoint-dev.yml'
  workflow_dispatch:

jobs:
  dev:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout FunctionalArbors
        uses: actions/checkout@v4
        with:
          repository: anttiluode/FunctionalArbors
          path: FunctionalArbors
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python reciprocal_adjoint_probe.py --selftest
      - name: Reused development seeds 240-241
        run: python reciprocal_adjoint_probe.py --functional-arbors FunctionalArbors --seed-start 240 --seeds 2 --out runs/reciprocal_adjoint_dev/reciprocal_adjoint_dev.json
      - uses: actions/upload-artifact@v4
        with:
          name: reciprocal-adjoint-dev
          path: runs/reciprocal_adjoint_dev/
