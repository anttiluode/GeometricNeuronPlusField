name: return-gate-controls-confirm

on:
  push:
    paths:
      - 'RETURN_GATE_CONTROLS_CONFIRM_PREREG_V01.md'
      - 'return_gate_controls.py'
      - 'return_gate_controls_confirm.py'
      - '.github/workflows/return-gate-controls-confirm.yml'
  workflow_dispatch:

jobs:
  confirm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout FunctionalArbors
        uses: actions/checkout@v4
        with:
          repository: anttiluode/FunctionalArbors
          path: FunctionalArbors
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python return_gate_controls.py --selftest
      - name: Fresh bodies 516-527
        run: python return_gate_controls.py --functional-arbors FunctionalArbors --seed-start 516 --seeds 12 --lag 20 --steps 210 --out runs/return_gate_controls_confirm/controls_516_527.json
      - name: Evaluate preregistration
        run: python return_gate_controls_confirm.py --receipt runs/return_gate_controls_confirm/controls_516_527.json --out runs/return_gate_controls_confirm/verdict.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: return-gate-controls-confirm-516-527
          path: runs/return_gate_controls_confirm/
