name: return-gate-controls-dev

on:
  push:
    paths:
      - 'return_gate_controls.py'
      - '.github/workflows/return-gate-controls-dev.yml'
  workflow_dispatch:

jobs:
  controls:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout FunctionalArbors
        uses: actions/checkout@v4
        with:
          repository: anttiluode/FunctionalArbors
          path: FunctionalArbors
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python return_gate_controls.py --selftest
      - name: Development bodies 510-515
        run: python return_gate_controls.py --functional-arbors FunctionalArbors --seed-start 510 --seeds 6 --lag 20 --steps 210 --out runs/return_gate_controls/dev_510_515.json
      - uses: actions/upload-artifact@v4
        with:
          name: return-gate-controls-dev-510-515
          path: runs/return_gate_controls/
