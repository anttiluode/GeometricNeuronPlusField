name: return-gate-spectral-dev

on:
  push:
    paths:
      - 'return_gate_spectral_mechanism.py'
      - '.github/workflows/return-gate-spectral-dev.yml'
  workflow_dispatch:

jobs:
  mechanism:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout FunctionalArbors
        uses: actions/checkout@v4
        with:
          repository: anttiluode/FunctionalArbors
          path: FunctionalArbors
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python return_gate_spectral_mechanism.py --selftest
      - name: Development bodies 534-539
        run: python return_gate_spectral_mechanism.py --functional-arbors FunctionalArbors --seed-start 534 --seeds 6 --lag 20 --steps 210 --out runs/return_gate_spectral/dev_534_539.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: return-gate-spectral-dev-534-539
          path: runs/return_gate_spectral/
