name: spectral-coordinate-locality

on:
  push:
    paths:
      - 'spectral_coordinate_locality.py'
      - '.github/workflows/spectral-coordinate-locality.yml'
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout FunctionalArbors
        uses: actions/checkout@v4
        with:
          repository: anttiluode/FunctionalArbors
          path: FunctionalArbors
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python spectral_coordinate_locality.py --selftest
      - name: Reused development seeds 240-243
        run: python spectral_coordinate_locality.py --functional-arbors FunctionalArbors --seed-start 240 --seeds 4 --P 8 --lags 16,20,24 --out runs/spectral_coordinate_locality/locality_240_243.json
      - uses: actions/upload-artifact@v4
        with:
          name: spectral-coordinate-locality-240-243
          path: runs/spectral_coordinate_locality/
