name: spectral-correlation-compression-confirm

on:
  push:
    paths:
      - 'SPECTRAL_CORRELATION_COMPRESSION_PREREG_V01.md'
      - '.github/workflows/spectral-correlation-compression-confirm.yml'
  workflow_dispatch:

jobs:
  confirm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout FunctionalArbors
        uses: actions/checkout@v4
        with:
          repository: anttiluode/FunctionalArbors
          path: FunctionalArbors
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python spectral_correlation_compression_probe.py --selftest
      - name: Fresh held-out seeds 400-411
        run: python spectral_correlation_compression_probe.py --functional-arbors FunctionalArbors --seed-start 400 --seeds 12 --lag 20 --steps 210 --out runs/spectral_correlation_compression_confirm/confirm_400_411.json
      - uses: actions/upload-artifact@v4
        with:
          name: spectral-correlation-compression-confirm-400-411
          path: runs/spectral_correlation_compression_confirm/
