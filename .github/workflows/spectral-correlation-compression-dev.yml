name: spectral-correlation-compression-dev

on:
  push:
    paths:
      - 'spectral_correlation_compression_probe.py'
      - '.github/workflows/spectral-correlation-compression-dev.yml'
  workflow_dispatch:

jobs:
  compression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout FunctionalArbors
        uses: actions/checkout@v4
        with:
          repository: anttiluode/FunctionalArbors
          path: FunctionalArbors
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python spectral_correlation_compression_probe.py --selftest
      - name: Reused development seeds 240-243
        run: python spectral_correlation_compression_probe.py --functional-arbors FunctionalArbors --seed-start 240 --seeds 4 --lag 20 --steps 210 --out runs/spectral_correlation_compression/dev_240_243.json
      - uses: actions/upload-artifact@v4
        with:
          name: spectral-correlation-compression-dev-240-243
          path: runs/spectral_correlation_compression/
