name: spectral-gradient-learning-confirm

on:
  push:
    paths:
      - 'SPECTRAL_GRADIENT_LEARNING_PREREG_V01.md'
      - '.github/workflows/spectral-gradient-learning-confirm.yml'
  workflow_dispatch:

jobs:
  confirm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout FunctionalArbors
        uses: actions/checkout@v4
        with:
          repository: anttiluode/FunctionalArbors
          path: FunctionalArbors
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python spectral_gradient_learning_probe.py --selftest
      - name: Fresh held-out seeds 412-423
        run: python spectral_gradient_learning_probe.py --functional-arbors FunctionalArbors --seed-start 412 --seeds 12 --lag 20 --steps 210 --max-candidates 8 --eta .01 --iterations 40 --out runs/spectral_gradient_learning_confirm/confirm_412_423.json
      - uses: actions/upload-artifact@v4
        with:
          name: spectral-gradient-learning-confirm-412-423
          path: runs/spectral_gradient_learning_confirm/
