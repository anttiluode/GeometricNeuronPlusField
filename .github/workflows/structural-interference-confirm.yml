name: structural-interference-confirm

on:
  push:
    paths:
      - 'STRUCTURAL_INTERFERENCE_CONFIRM_PREREG_V01.md'
      - '.github/workflows/structural-interference-confirm.yml'
  workflow_dispatch:

jobs:
  confirm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout FunctionalArbors
        uses: actions/checkout@v4
        with:
          repository: anttiluode/FunctionalArbors
          path: FunctionalArbors
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python structural_interference_probe.py --selftest
      - name: Held-out seeds 168-179
        run: python structural_interference_probe.py --functional-arbors FunctionalArbors --seed-start 168 --seeds 12 --max-each 6 --out runs/structural_interference_confirm/structural_interference_168_179.json
      - uses: actions/upload-artifact@v4
        with:
          name: structural-interference-confirm-168-179
          path: runs/structural_interference_confirm/
