name: temporal-trim-wall-dev

on:
  push:
    paths:
      - 'temporal_trim_wall_probe.py'
      - '.github/workflows/temporal-trim-wall-dev.yml'
  workflow_dispatch:

jobs:
  wall:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout FunctionalArbors
        uses: actions/checkout@v4
        with:
          repository: anttiluode/FunctionalArbors
          path: FunctionalArbors
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python temporal_trim_wall_probe.py --selftest
      - name: Reused development seeds 240-243
        run: python temporal_trim_wall_probe.py --functional-arbors FunctionalArbors --seed-start 240 --seeds 4 --lag 20 --steps 210 --out runs/temporal_trim_wall/dev_240_243.json
      - uses: actions/upload-artifact@v4
        with:
          name: temporal-trim-wall-dev-240-243
          path: runs/temporal_trim_wall/
